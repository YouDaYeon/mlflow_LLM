services:
  postgres:
    image: "postgres:latest"
    environment:
      POSTGRES_USER: mlflow_llm
      POSTGRES_PASSWORD: mlflow_llm
      POSTGRES_DB: reports
    volumes:
      - ./db-data/:/var/lib/postgresql
    ports:
      - "5435:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mlflow_llm:mlflow_llm@postgres:5432/reports
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://127.0.0.1:2522}

      CHAT_BASE_URL: ${CHAT_BASE_URL:-http://127.0.0.1:9978}
      CHAT_API_KEY: ${CHAT_API_KEY:-llama-local}
      CHAT_MODEL: ${CHAT_MODEL:-Qwen3.6-35B-A3B}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0.2}

      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://127.0.0.1:9976/v1}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-llama-local}
      LLAMA_MODEL: ${LLAMA_MODEL:-gemma-4-31B-it-UD-Q8_K_XL}
      LLAMA_TEMPERATURE: ${LLAMA_TEMPERATURE:-0.2}
    depends_on:
      - postgres
    ports:
      - "8010:8010"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://backend:8010}
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgadmin-data:
